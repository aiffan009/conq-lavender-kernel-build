name: Conq 4.4 KernelSU Next 12797

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conq-kernelsu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out build files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev libncurses-dev libtinfo5 python3 zip unzip
      - name: Build tested 4.4 base with KernelSU Next manual hooks
        run: bash scripts/build_kernelsu_next.sh
      - name: Save kernel artifacts and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: conq-4.4-ksunext-${{ github.run_number }}
          path: |
            artifacts/
            logs/
          retention-days: 7
          if-no-files-found: warn
