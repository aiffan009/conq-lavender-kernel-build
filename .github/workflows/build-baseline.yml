name: Conq 4.4 baseline - no KernelSU yet

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conq-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out build files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev libncurses-dev libtinfo5 python3 zip unzip
      - name: Build matching 4.4 source and package test boot
        run: bash scripts/build_baseline.sh
      - name: Save build artifacts and diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conq-4.4-baseline-${{ github.run_number }}
          path: |
            artifacts/
            logs/
          retention-days: 7
          if-no-files-found: warn
